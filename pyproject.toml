[project]
name = "bankai"
version = "1.0.0"
description = "卍解 Reiatsu Security Audit — audit de sécurité non destructif et auto-remediation pour ta propre infrastructure web."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Retrouvable" }]
license = { text = "MIT" }
keywords = ["security", "audit", "hardening", "cloudflare", "defensive"]
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
]

[project.scripts]
bankai = "bankai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bankai"]
